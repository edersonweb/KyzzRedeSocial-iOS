workflows:
  ios-release:
    name: iOS Release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic 2"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.kyzz.app
      xcode: latest
      vars:
        XCODE_PROJECT: "KyzzRedeSocial.xcodeproj"
        XCODE_SCHEME: "KyzzRedeSocial"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Instalar XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Gerar projeto Xcode
        script: xcodegen generate

      - name: Configurar assinatura
        script: xcode-project use-profiles

      - name: Gerar IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
